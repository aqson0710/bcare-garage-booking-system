# Nginx reverse proxy for BCare -> 127.0.0.1:3301
# Install (as root on the VPS):
#   cp nginx.conf /etc/nginx/sites-available/u-chang-o.tech
#   ln -s /etc/nginx/sites-available/u-chang-o.tech /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d u-chang-o.tech -d www.u-chang-o.tech --redirect
# certbot adds the HTTPS (443) server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name u-chang-o.tech www.u-chang-o.tech;

    # payment slips / product images upload through the app
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
